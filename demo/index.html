<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIOS — Operations Console (Concept Prototype)</title>
<style>
  :root{
    --bg:#0a0a0c; --bg2:#0c0c11; --surface:#121218; --surface2:#1a1a22; --surface3:#22222c;
    --border:#2b2b36; --border2:#3a3a47;
    --gold:#e8c97d; --gold-dim:#b9974f; --cyan:#6ad7e6;
    --text:#eceaf0; --muted:#9a9aa8; --faint:#6b6b78;
    --green:#54e09b; --amber:#f6bf52; --red:#f87171; --blue:#7aa2f7;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
  .flower{position:fixed;inset:0;pointer-events:none;opacity:.04;background-image:radial-gradient(circle, var(--gold) 0 1px, transparent 1px);background-size:40px 40px;z-index:0}
  ::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:8px}::-webkit-scrollbar-track{background:transparent}

  header{display:flex;align-items:center;gap:16px;padding:12px 22px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,#101016,#0c0c11);position:relative;z-index:5}
  .brand{display:flex;align-items:center;gap:12px}
  .seed{width:34px;height:34px;flex:0 0 34px}
  .brand h1{font-size:16px;font-weight:700;letter-spacing:.3px;display:flex;align-items:baseline;gap:9px}
  .brand h1 .tm{font-size:9px;color:var(--gold);transform:translateY(-6px)}
  .brand .sub{font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.4px}
  .roles{display:flex;gap:6px;margin-left:22px}
  .rolepill{font-size:12.5px;color:var(--muted);background:var(--surface);border:1px solid var(--border);padding:7px 13px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:7px;transition:.12s}
  .rolepill:hover{border-color:var(--border2)}
  .rolepill.on{color:var(--text);background:var(--surface3);border-color:var(--gold-dim)}
  .rolepill .ic{font-size:12px;opacity:.85}
  .proto{margin-left:auto;display:flex;align-items:center;gap:10px}
  .proto .warn{font-size:10px;font-weight:700;letter-spacing:.6px;color:#1a1408;background:var(--amber);padding:4px 11px;border-radius:5px}
  .clock{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .askbtn{font-size:12.5px;font-weight:600;color:#0c0c11;background:linear-gradient(180deg,var(--gold),var(--gold-dim));border:none;padding:8px 14px;border-radius:7px;cursor:pointer;display:flex;align-items:center;gap:7px}
  .askbtn:hover{filter:brightness(1.08)}

  .app{display:grid;grid-template-columns:380px 1fr;height:calc(100vh - 60px);position:relative;z-index:1}
  .left{border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;background:#0d0d12}
  .right{display:flex;flex-direction:column;min-height:0;overflow:hidden}

  .lhead{padding:14px 18px 6px;display:flex;align-items:center;justify-content:space-between}
  .lhead .t{font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--gold)}
  .lhead .c{font-family:var(--mono);font-size:11px;color:var(--faint)}
  .pqhead{padding:0 18px 10px}
  .pqstat{font-size:11.5px;color:var(--muted);font-family:var(--mono)}
  .pqstat b{color:var(--red)} .pqstat .amb{color:var(--amber)} .pqstat .cy{color:var(--cyan)}
  .filters{display:flex;gap:6px;padding:0 16px 10px}
  .chip{font-size:11px;color:var(--muted);background:var(--surface);border:1px solid var(--border);padding:5px 11px;border-radius:20px;cursor:pointer;white-space:nowrap;transition:.12s}
  .chip:hover{border-color:var(--border2)}
  .chip.on{color:var(--text);background:var(--surface3);border-color:var(--border2)}
  .chip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle}
  .banner{margin:0 12px 10px;padding:9px 13px;border-radius:9px;background:rgba(106,215,230,.06);border:1px solid rgba(106,215,230,.25);font-size:11.5px;color:var(--cyan);line-height:1.5}
  .blotter{overflow-y:auto;flex:1;padding:0 10px 16px}
  .trow{padding:11px 13px;border-radius:9px;cursor:pointer;border:1px solid transparent;margin-bottom:3px;transition:.1s}
  .trow:hover{background:var(--surface)}
  .trow.sel{background:var(--surface2);border-color:var(--border2)}
  .trow .r1{display:flex;align-items:center;gap:9px;margin-bottom:3px}
  .trow .inst{font-weight:650;font-size:13.5px}
  .trow .tag{margin-left:auto;font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:2px 7px;border-radius:4px}
  .trow .r2{font-size:11.5px;color:var(--muted);font-family:var(--mono);display:flex;gap:8px}
  .trow .r1b{display:flex;align-items:center;gap:8px;margin-top:4px}
  .trow .id{font-size:11px;color:var(--faint);font-family:var(--mono)}
  .trow .cutoff{margin-left:auto;font-size:10px;color:var(--amber);font-family:var(--mono)}
  .sdot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
  .s-healthy{background:var(--green)} .s-warning{background:var(--amber)} .s-break{background:var(--red)}
  .tag.s-healthy{background:rgba(84,224,155,.13);color:var(--green)}
  .tag.s-warning{background:rgba(246,191,82,.13);color:var(--amber)}
  .tag.s-break{background:rgba(248,113,113,.14);color:var(--red)}

  .detail{overflow-y:auto;flex:1;padding:0 0 40px}
  .dhead{padding:20px 26px 16px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,#101015,#0d0d12);position:sticky;top:0;z-index:3}
  .dhead .top{display:flex;align-items:flex-start;gap:14px}
  .dhead h2{font-size:21px;font-weight:700;letter-spacing:.2px}
  .dhead .meta{font-size:12px;color:var(--muted);margin-top:3px;font-family:var(--mono)}
  .dhead .right-tag{margin-left:auto;text-align:right}
  .prob{font-size:30px;font-weight:800;line-height:1;font-family:var(--mono)}
  .prob.s-break{color:var(--red)} .prob.s-warning{color:var(--amber)} .prob.s-healthy{color:var(--green)}
  .prob-l{font-size:10px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;margin-top:4px}

  .sec{padding:22px 26px;border-bottom:1px solid var(--border)}
  .sec h3{font-size:11px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--gold);margin-bottom:16px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .sec h3 .n{font-family:var(--mono);color:var(--faint);font-weight:600}
  .sec h3 .hint{color:var(--faint);font-weight:500;text-transform:none;letter-spacing:0;font-size:11px}

  .timeline{display:flex;align-items:flex-start;gap:0;position:relative}
  .stage{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;z-index:2}
  .stage .node{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;border:2px solid var(--border2);background:var(--surface);margin-bottom:9px}
  .stage.done .node{border-color:var(--green);color:var(--green);background:rgba(84,224,155,.1)}
  .stage.warning .node{border-color:var(--amber);color:var(--amber);background:rgba(246,191,82,.1)}
  .stage.fail .node{border-color:var(--red);color:var(--red);background:rgba(248,113,113,.12);box-shadow:0 0 0 4px rgba(248,113,113,.08)}
  .stage.pending .node{border-style:dashed;color:var(--faint)}
  .stage .sn{font-size:11.5px;font-weight:600}
  .stage .st{font-size:10px;color:var(--faint);font-family:var(--mono);margin-top:2px}
  .tbar{position:absolute;top:15px;left:8%;right:8%;height:2px;background:var(--border2);z-index:1}

  .sim{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:16px 18px}
  .sim .h{font-size:12px;color:var(--muted);margin-bottom:13px}
  .sim .h b{color:var(--gold)}
  .simflow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .simnode{font-size:11px;padding:7px 11px;border-radius:7px;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;gap:7px;font-family:var(--mono)}
  .simnode.ok{border-color:rgba(84,224,155,.35)} .simnode.ok .d{background:var(--green)}
  .simnode.bad{border-color:var(--red);background:rgba(248,113,113,.07)} .simnode.bad .d{background:var(--red)}
  .simnode .d{width:7px;height:7px;border-radius:50%;background:var(--faint)}
  .simarrow{color:var(--faint);font-size:14px}

  .ai{background:linear-gradient(135deg,rgba(232,201,125,.06),rgba(106,215,230,.04));border:1px solid var(--gold-dim);border-radius:12px;padding:18px 20px}
  .ai .ahead{display:flex;align-items:center;gap:11px;margin-bottom:14px;flex-wrap:wrap}
  .ai .badge{font-size:9px;font-weight:800;letter-spacing:1px;color:#0c0c11;background:var(--gold);padding:3px 8px;border-radius:5px}
  .ai .ah-t{font-size:15px;font-weight:700}
  .ai .ddl{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--red);font-weight:600}
  .ai .grid{display:grid;gap:12px}
  .ai .row{display:grid;grid-template-columns:88px 1fr;gap:14px;align-items:start}
  .ai .row .k{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);padding-top:2px}
  .ai .row .v{font-size:13px;color:var(--text);line-height:1.55}
  .ai .fix{color:var(--green)}
  .ai .actions{margin-top:16px;display:flex;gap:9px;flex-wrap:wrap}
  .btn{font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:7px;cursor:pointer;border:1px solid var(--border2);background:var(--surface2);color:var(--text)}
  .btn.primary{background:linear-gradient(180deg,var(--green),#3aa876);color:#06140d;border:none}
  .btn:hover{filter:brightness(1.08)}

  .lenstabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:16px}
  .lenstab{font-size:11.5px;color:var(--muted);background:var(--surface);border:1px solid var(--border);padding:7px 13px;border-radius:7px;cursor:pointer;transition:.12s}
  .lenstab:hover{border-color:var(--border2)}
  .lenstab.on{color:#0c0c11;background:var(--cyan);border-color:var(--cyan);font-weight:650}
  .lensbody{background:var(--surface);border:1px solid var(--border);border-radius:11px;overflow:hidden}
  .lenscap{padding:10px 16px;font-size:11px;color:var(--muted);border-bottom:1px solid var(--border);background:var(--surface2)}
  .lenscap b{color:var(--cyan)} .lenscap i{color:var(--faint)}
  .kv{display:grid;grid-template-columns:1fr 1fr}
  .kv .cell{padding:13px 16px;border-bottom:1px solid var(--border);border-right:1px solid var(--border)}
  .kv .cell:nth-child(2n){border-right:none}
  .kv .cell .k{font-size:10px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
  .kv .cell .v{font-size:14px;font-weight:600;font-family:var(--mono)}

  .ge{background:#0c0c10;border:1px solid var(--border);border-radius:11px;padding:16px 18px;font-family:var(--mono);font-size:12px;line-height:1.7;overflow-x:auto}
  .ge .line{white-space:pre}
  .ge .key{color:var(--cyan)} .ge .str{color:var(--gold)} .ge .num{color:var(--green)} .ge .pun{color:var(--faint)} .ge .cm{color:var(--faint);font-style:italic}
  .note{font-size:11.5px;color:var(--faint);margin-top:13px;line-height:1.5}
  .note b{color:var(--muted)}

  /* Overview (manager) */
  .ov{overflow-y:auto;flex:1;padding:26px 30px 60px}
  .ovh{font-size:23px;font-weight:750;letter-spacing:-.4px}
  .ovsub{font-size:13px;color:var(--muted);margin-top:4px;font-family:var(--mono);margin-bottom:24px}
  .ovgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .ovcard{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:14px;padding:18px}
  .ovcard .big{font-size:32px;font-weight:800;font-family:var(--mono);line-height:1}
  .ovcard .lab{font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-top:9px}
  .ovcard .sb{font-size:11px;color:var(--faint);margin-top:4px;line-height:1.4}
  .ovcard.red .big{color:var(--red)} .ovcard.amber .big{color:var(--amber)} .ovcard.green .big{color:var(--green)} .ovcard.cyan .big{color:var(--cyan)}
  .ovsec{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--gold);margin:28px 0 14px}
  .ovtable{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
  .ovtable th{font-size:10px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);text-align:left;padding:11px 16px;border-bottom:1px solid var(--border);font-weight:600}
  .ovtable td{font-size:13px;padding:11px 16px;border-bottom:1px solid var(--border);font-family:var(--mono)}
  .ovtable tr:last-child td{border-bottom:none}
  .ovtable .b{color:var(--red);font-weight:700} .ovtable .a{color:var(--amber)} .ovtable .g{color:var(--green)}
  .ovtop{display:flex;flex-direction:column;gap:8px}
  .ovtoprow{display:flex;align-items:center;gap:13px;padding:12px 15px;background:var(--surface);border:1px solid var(--border);border-radius:10px;cursor:pointer;transition:.12s}
  .ovtoprow:hover{border-color:var(--border2);transform:translateX(2px)}
  .ovtoprow .pct{font-family:var(--mono);font-weight:800;font-size:17px;color:var(--red);width:50px}
  .ovtoprow .nm{font-weight:600;font-size:13.5px}
  .ovtoprow .ds{font-size:11.5px;color:var(--muted);font-family:var(--mono);margin-top:1px}
  .ovtoprow .co{margin-left:auto;font-size:11px;color:var(--amber);font-family:var(--mono)}
  .valuenote{margin-top:24px;padding:16px 18px;border-radius:12px;background:linear-gradient(135deg,rgba(232,201,125,.06),rgba(84,224,155,.04));border:1px solid var(--gold-dim);font-size:13px;color:var(--text);line-height:1.65}
  .valuenote b{color:var(--gold)}

  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;opacity:0;pointer-events:none;transition:.18s}
  .overlay.on{opacity:1;pointer-events:auto}
  .assistant{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:92vw;background:#0e0e13;border-left:1px solid var(--border2);z-index:21;transform:translateX(100%);transition:.22s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
  .assistant.on{transform:none}
  .ahd{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:11px}
  .ahd .seed{width:26px;height:26px}
  .ahd .tt{font-size:14px;font-weight:700}
  .ahd .ss{font-size:10.5px;color:var(--muted)}
  .ahd .x{margin-left:auto;cursor:pointer;color:var(--muted);font-size:22px;line-height:1}
  .achat{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
  .msg{max-width:90%}
  .msg.u{align-self:flex-end;background:var(--surface3);border:1px solid var(--border2);padding:9px 13px;border-radius:12px 12px 3px 12px;font-size:13px}
  .msg.a{align-self:flex-start;font-size:13px;line-height:1.6}
  .msg.a .av{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
  .msg.a .bubble{background:var(--surface);border:1px solid var(--border);padding:12px 14px;border-radius:3px 12px 12px 12px}
  .msg.a .bubble b{color:var(--text)} .msg.a .bubble .fix{color:var(--green)}
  .msg.a .resref{margin-top:9px;display:flex;flex-direction:column;gap:5px}
  .msg.a .rr{font-size:11.5px;font-family:var(--mono);color:var(--muted);padding:6px 9px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;cursor:pointer;display:flex;gap:8px;align-items:center}
  .msg.a .rr:hover{border-color:var(--border2)} .msg.a .rr b{color:var(--cyan)}
  .sugg{padding:0 20px 12px;display:flex;flex-direction:column;gap:7px}
  .sugg .s{font-size:12px;color:var(--cyan);background:rgba(106,215,230,.06);border:1px solid rgba(106,215,230,.2);padding:9px 12px;border-radius:8px;cursor:pointer}
  .sugg .s:hover{background:rgba(106,215,230,.1)}
  .ain{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:9px}
  .ain input{flex:1;background:var(--surface);border:1px solid var(--border2);border-radius:8px;padding:10px 13px;color:var(--text);font-size:13px;font-family:var(--sans)}
  .ain input:focus{outline:none;border-color:var(--gold-dim)}
  .ain button{background:var(--gold);border:none;border-radius:8px;width:40px;cursor:pointer;color:#0c0c11;font-size:16px}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0f1a13;border:1px solid var(--green);color:#bff5d8;padding:12px 18px;border-radius:9px;font-size:13px;z-index:50;max-width:560px;box-shadow:0 8px 30px rgba(0,0,0,.5);transition:opacity .4s}
  @media(max-width:980px){.app{grid-template-columns:1fr}.left{display:none}.roles{display:none}}
</style>
</head>

<div class="flower"></div>

<header>
  <div class="brand">
    <svg class="seed" viewBox="0 0 100 100" fill="none" stroke="#e8c97d" stroke-width="1.4">
      <circle cx="50" cy="50" r="15"/><circle cx="50" cy="35" r="15"/><circle cx="50" cy="65" r="15"/>

    </svg>
    <div>
      <h1>FIOS<span class="tm">™</span> <span class="sub">Operations Console</span></h1>

<script>
"use strict";
function h(tag, props){
  var e=document.createElement(tag);
  if(props) for(var k in props){
    var v=props[k];
    if(k==='class')e.className=v;
    else if(k==='text')e.textContent=v;
    else if(k==='style')e.setAttribute('style',v);
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2).toLowerCase(),v);
    else e.setAttribute(k,v);
  }
  for(var i=2;i<arguments.length;i++)append(e,arguments[i]);
  return e;
}
function append(e,kid){
  if(kid==null||kid===false)return;
  if(Array.isArray(kid)){kid.forEach(function(k){append(e,k);});return;}
  e.append(kid.nodeType?kid:document.createTextNode(String(kid)));
}
function mount(id,node){document.getElementById(id).replaceChildren(node);}
function rich(s){return s.split('**').map(function(p,i){return i%2?h('b',{text:p}):document.createTextNode(p);});}

function notional(t){return t.qty*t.price*t.mult;}
function m(x){return '$'+Math.round(x).toLocaleString();}
function fmtN(t){return m(notional(t));}
function pnl(t){return (t.status==='healthy'?Math.round(notional(t)*0.004):-Math.round(notional(t)*0.002)).toLocaleString();}
function gu(t){return t.acct.indexOf('GIVE-UP')>-1 ? (t.status==='break'?'Unresolved → buffer':'BNS-CLEAR (take-up ✓)') : 'N/A (house)';}
function cutoff(t){return t.ai?t.ai.ddl:null;}

    geLine('  ',K('"product"'),P(': { '),K('"venue"'),P(':'),S('"'+t.venue+'"'),P(', '),K('"cfi"'),P(':'),S('"'+t.cfi+'"'),P(', '),K('"name"'),P(':'),S('"'+t.inst+'"'),P(' },')),
    geLine('  ',K('"economics"'),P(': { '),K('"side"'),P(':'),S('"'+t.side+'"'),P(', '),K('"qty"'),P(':'),N(t.qty),P(', '),K('"price"'),P(':'),N(t.price),P(', '),K('"ccy"'),P(':'),S('"'+t.ccy+'"'),P(' },')),
    geLine('  ',K('"clearing"'),P(': { '),K('"ccp"'),P(':'),S('"'+t.ccp+'"'),P(', '),K('"uti"'),P(':'),S('"'+t.uti+'"'),P(' },')),
    geLine('  ',K('"obligations"'),P(': ['),S('"'+t.oblig.join('", "')+'"'),P('],')),
    geLine('  ',K('"integrity"'),P(': { '),K('"hash"'),P(':'),S('"sha256:9f2c…"'),P(', '),K('"validated"'),P(':'),N(t.status!=='break'),P(' }')),
    geLine(P('}')));
}
function resolve(id){
  var t=TRADES.find(function(x){return x.id===id;});
  t.status='healthy';t.prob=2;t.ai=null;
  t.lifecycle=t.lifecycle.map(function(s){return [s[0],'done',s[2]==='—'?'14:18:30':s[2]];});
  t.sim=t.sim.map(function(s){return [s[0],'ok'];});
  render();
  toast('Fix applied on the golden event — propagated to clearing, booking & the CIRO / NI 96-101 obligation.');
}
var toastTimer;
function toast(msg){
  var ex=document.getElementById('toast'); if(ex)ex.remove();
  var el=h('div',{class:'toast',id:'toast',text:'✓ '+msg});
  document.body.append(el);
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){el.style.opacity='0';setTimeout(function(){el.remove();},420);},3400);
}

const QA=[
 {q:'Which trades will break today?',a:function(){var b=TRADES.filter(function(t){return t.status==='break';}),w=TRADES.filter(function(t){return t.status==='warning';});
   return {nodes:rich('**'+b.length+' trades** are predicted to break before their cut-offs, plus '+w.length+' at-risk. FIOS flagged each at point-of-capture — all fixable upstream before they propagate:'),
     refs:b.map(function(t){return [t.id,t.inst+' — '+t.ai.head.replace(/^\d+% break probability — /,'')];})};}},
 {q:'Why will SXF Sep-26 (EVT-SXF-100482) break?',a:function(){var t=TRADES.find(function(x){return x.id==='EVT-SXF-100482';});
   if(t&&t.ai)return {nodes:[h('b',{text:t.ai.head+'.'}),h('br'),h('br')].concat(rich(t.ai.cause)).concat([h('br'),h('br'),h('span',{class:'fix',text:'Fix: '})]).concat(rich(t.ai.fix)),refs:[[t.id,'Open trade']]};
   return {nodes:[document.createTextNode('That trade is now clean — the fix was applied to the golden event.')],refs:[]};}},
 {q:'What is today’s expected reconciliation workload?',a:function(){return {nodes:rich('**Near-zero internal reconciliation.** Every internal consumer derives from one golden event, so there is nothing to reconcile between desks. The remaining work is **external**: '+TRADES.filter(function(t){return t.status==='break';}).length+' items to confirm against CDCC / custodian records before cut-off — reduced to a single clean-source check rather than matching diverged copies.'),refs:[]};}},
 {q:'Show the give-up exceptions.',a:function(){var g=TRADES.filter(function(t){return t.acct.indexOf('GIVE-UP')>-1&&t.status!=='healthy';});
   return {nodes:rich(g.length+' give-up / take-up exception(s) open. Give-ups route to the carrying broker; an unresolved give-up account sends the position to the executing broker’s buffer at the 15:30 CDCC cut-off:'),
     refs:g.map(function(t){return [t.id,t.inst+' — '+gu(t)];})};}},
];
let chat=[];
function openAssistant(){
  document.getElementById('assistant').classList.add('on');document.getElementById('overlay').classList.add('on');
  if(!chat.length){pushA({nodes:[document.createTextNode('I’m the FIOS Operations Assistant. I reason over the live golden-event store — ask me anything about today’s flow. Try one of these:')],refs:[]});renderSugg();}
}
function closeAssistant(){document.getElementById('assistant').classList.remove('on');document.getElementById('overlay').classList.remove('on');}
function renderSugg(){mount('sugg',h('div',{},QA.map(function(x,i){return h('div',{class:'s',text:x.q,onclick:function(){ask(i);}});})));}
function pushU(t){chat.push({r:'u',t:t});renderChat();}
function pushA(o){chat.push({r:'a',o:o});renderChat();}
function renderChat(){
  mount('achat', h('div',{style:'display:flex;flex-direction:column;gap:14px'}, chat.map(function(msg){
    if(msg.r==='u')return h('div',{class:'msg u',text:msg.t});
    var refs=(msg.o.refs||[]).map(function(r){return h('div',{class:'rr',onclick:function(){select(r[0]);closeAssistant();}}, '↗ ', h('b',{text:r[0]}), ' · '+r[1]);});
    return h('div',{class:'msg a'}, h('div',{class:'av',text:'✦ FIOS AI'}),
      h('div',{class:'bubble'}, msg.o.nodes, refs.length?h('div',{class:'resref'},refs):null));
  })));
  var c=document.getElementById('achat');c.scrollTop=c.scrollHeight;
}
function ask(i){pushU(QA[i].q);setTimeout(function(){pushA(QA[i].a());},260);}
function sendAsk(){
  var el=document.getElementById('ainput');var v=el.value.trim();if(!v)return;el.value='';
  pushU(v);var low=v.toLowerCase();var hit=null;
  if(low.indexOf('sxf')>-1||low.indexOf('100482')>-1)hit=QA[1];
  else if(low.indexOf('recon')>-1||low.indexOf('workload')>-1)hit=QA[2];
  else if(low.indexOf('give')>-1||low.indexOf('take-up')>-1)hit=QA[3];
  else if(low.indexOf('break')>-1||low.indexOf('today')>-1||low.indexOf('fail')>-1)hit=QA[0];
  setTimeout(function(){ if(hit)pushA(hit.a()); else pushA({nodes:[document.createTextNode('In this prototype I answer over the synthetic listed-derivatives book. Try: which trades will break today · why will SXF Sep-26 break · today’s reconciliation workload · the give-up exceptions.')],refs:[]});},260);
}

document.getElementById('askbtn').addEventListener('click',openAssistant);
document.getElementById('aclose').addEventListener('click',closeAssistant);
document.getElementById('overlay').addEventListener('click',closeAssistant);
document.getElementById('asend').addEventListener('click',sendAsk);
document.getElementById('ainput').addEventListener('keydown',function(e){if(e.key==='Enter')sendAsk();});

var sec=2;
setInterval(function(){sec=(sec+1)%3600;var mm=18+Math.floor(sec/60),ss=sec%60;document.getElementById('clock').textContent='14:'+String(mm).padStart(2,'0')+':'+String(ss).padStart(2,'0')+' ET';},1000);

renderFilters();render();
</script>
